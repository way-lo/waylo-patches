name: Build .mpp

# Manual build of the patch bundle from any branch. The bundle is attached to the run as an artifact.
# For real releases, use the Release workflow (semantic-release, as in the Morphe patches template).

on:
  workflow_dispatch:
  push:
    branches:
      - 'test/**'

jobs:
  build:
    name: Build patches bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # Fall back to Gradle's GitHub mirror when services.gradle.org is down.
          if ! curl -sfI --max-time 15 "$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | sed 's/\\:/:/')" >/dev/null; then
            sed -i -E 's#https\\://services.gradle.org/distributions/gradle-([0-9.]+)-bin.zip#https\\://github.com/gradle/gradle-distributions/releases/download/v\1/gradle-\1-bin.zip#' gradle/wrapper/gradle-wrapper.properties
            grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          fi
          if ! ./gradlew :patches:buildAndroid --no-daemon 2>&1 | tee build.log; then
            # Surface compiler errors as annotations, which are readable without opening the log.
            grep -E "^e: |error:|What went wrong|Could not|Exception" build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Upload .mpp
        uses: actions/upload-artifact@v4
        with:
          name: patches-mpp
          path: patches/build/libs/patches-*.mpp
          if-no-files-found: error
